# Sample production backend. Edit the CORS origin, then apply in Render.
# Do not put real secrets in this file.

databases:
  - name: egy-db
    plan: free
    postgresMajorVersion: "15"

services:
  - type: web
    name: egy-api
    runtime: docker
    rootDir: apps/backend
    healthCheckPath: /health/live
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: egy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
